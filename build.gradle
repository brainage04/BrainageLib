plugins {
	id 'maven-publish'
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.maven-central-publishing' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}

repositories {
	mavenLocal()
}

workspaceDependencies {
	siblingMaven("FabricModdingConventions") {
		coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}")
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

mavenCentralPublishing {
	repository.set("brainage04/BrainageLib")
	publicationName.set("BrainageLib")
	description.set("Shared server-side command feedback and mod discovery for brainage04 Minecraft mods.")
}

pluginManager.withPlugin("io.github.brainage04.client-gametest-recorder") {
	clientGameTestRecorder {
		minecraftOptionsVersion.set("4671")
		maxFps.set("30")
		renderDistance.set("5")
		simulationDistance.set("5")
		guiScale.set("3")
	}
}

productionGameTests {
	includeClient.set(true)
	clientRunDir.set(clientGameTestRecorder.runDir)
	clientUseXvfb.set(providers.environmentVariable("GTR_RECORDING_MANAGED_XVFB")
			.map { value -> !value.toBoolean() }
			.orElse(true))
}

tasks.named("recordClientGameTest") {
	runTaskName.set("runProductionClientGameTest")
}

tasks.named("prepareClientGameTestRun") {
	mustRunAfter("prepareProductionGameTestRuns")
}

tasks.matching { it.name == "runProductionClientGameTest" }.configureEach {
	dependsOn("prepareClientGameTestRun")
}
