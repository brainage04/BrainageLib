plugins {
	id 'io.github.brainage04.maven-central-publishing' version "${minecraftmodconventions_version}"
}

mavenCentralPublishing {
	repository.set('brainage04/BrainageLib')
	publicationName.set(rootProject.mod_name)
	description.set('Shared server-side command feedback and mod discovery for brainage04 NeoForge mods.')
	localRepository.set(rootProject.layout.buildDirectory.dir('local-repo'))
}

// :fabric:publishToMavenCentral uploads this publication too and then finalizes one Central deployment for both
// loaders. This project's finalizer would move whatever is staged at that moment into a second deployment
// (MinecraftModConventions 3.1.2, FinalizeMavenCentralDeploymentTask), so a plain `publishToMavenCentral` skips it;
// the upload it depends on still runs.
tasks.named('publishToMavenCentral') {
	enabled = false
}

tasks.register('javadocJar', Jar) {
	archiveClassifier = 'javadoc'
	from rootProject.file('README.md')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = "${rootProject.archives_base_name}-neoforge"
			from components.java
			artifact tasks.named('javadocJar')
		}
	}
}

// BrainageLib's own GameTests use the published fixtures from source.
sourceSets.matching { it.name == 'gametest' }.configureEach {
	java.srcDir(rootProject.file('common/src/testSupport/java'))
}
