modLoader="javafml"
loaderVersion="[11,)"
license="MIT"
issueTrackerURL="https://github.com/brainage04/BrainageLib/issues"

[[mods]]
modId="brainagelib"
version="${version}"
displayName="BrainageLib"
iconFile="assets/brainagelib/icon.png"
description='''Shared server-side command feedback and mod discovery for brainage04 Minecraft mods.'''
authors="brainage04"
displayURL="https://github.com/brainage04/BrainageLib"

[[dependencies.brainagelib]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.brainagelib]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Telekinesis before 1.2.0 ships its own capture engine on the same hooks, which would bypass the
# policies (a minigame's match rules) this one asks.
[[dependencies.brainagelib]]
modId="telekinesis"
type="incompatible"
versionRange="(,1.2.0)"
reason="Telekinesis before 1.2.0 has its own drop capture; update it to 1.2.0 or later."
ordering="NONE"
side="BOTH"

[[mixins]]
config="brainagelib.mixins.json"
